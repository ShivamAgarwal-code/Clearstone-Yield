<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background drawn from the logo's inner-left highlight palette (g-h-left) -->
    <radialGradient id="bg-warm" cx="28%" cy="22%" r="55%">
      <stop offset="0%"   stop-color="#E2E7EF"/>
      <stop offset="100%" stop-color="#E2E7EF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-cool" cx="65%" cy="80%" r="80%">
      <stop offset="0%"   stop-color="#BCC9DA"/>
      <stop offset="100%" stop-color="#9DACC2"/>
    </radialGradient>

    <!-- Soft darker halo behind the mark (light bg now requires dark halo) -->
    <radialGradient id="halo" cx="50%" cy="50%" r="42%">
      <stop offset="0%"   stop-color="#3F506E" stop-opacity="0.20"/>
      <stop offset="55%"  stop-color="#3F506E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3F506E" stop-opacity="0"/>
    </radialGradient>

    <!-- Isometric guide pattern: 30/150 deg lattice referencing the faceted logo -->
    <pattern id="iso" width="44" height="25.4" patternUnits="userSpaceOnUse">
      <path d="M0 25.4 L22 0 L44 25.4 M0 0 L22 25.4 L44 0"
            fill="none" stroke="#3F506E" stroke-opacity="0.08" stroke-width="0.5"/>
    </pattern>

    <!-- Inner ring stroke gradient -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3F506E" stop-opacity="0.45"/>
      <stop offset="55%"  stop-color="#6F8099" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3F506E" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Mask: only show pattern + halo within an inner disc, so corners stay clean for the circle crop -->
    <radialGradient id="discMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="78%"  stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="disc">
      <rect width="400" height="400" fill="url(#discMask)"/>
    </mask>

    <!-- Logo gradients -->
    <linearGradient id="g-top" x1="87.5" y1="175.5" x2="205" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3F4F6B"/>
      <stop offset="100%" stop-color="#9DACC2"/>
    </linearGradient>
    <linearGradient id="g-left" x1="0" y1="123" x2="87.5" y2="346.8" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7E8EA7"/>
      <stop offset="100%" stop-color="#1F2D48"/>
    </linearGradient>
    <linearGradient id="g-front" x1="0" y1="346.8" x2="304.5" y2="471.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#5E6E89"/>
      <stop offset="100%" stop-color="#15213B"/>
    </linearGradient>
    <linearGradient id="g-h-top" x1="16.5" y1="175" x2="195" y2="26.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A6B3C5"/>
      <stop offset="100%" stop-color="#F0F4F9"/>
    </linearGradient>
    <linearGradient id="g-h-left" x1="16.5" y1="134" x2="71.5" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F4F7FB"/>
      <stop offset="55%"  stop-color="#BCC9DA"/>
      <stop offset="100%" stop-color="#6F8099"/>
    </linearGradient>
    <linearGradient id="g-h-front" x1="16.5" y1="334" x2="209" y2="454" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#B5C2D2"/>
      <stop offset="100%" stop-color="#3F506E"/>
    </linearGradient>
    <linearGradient id="g-f-top" x1="209" y1="98.5" x2="412.5" y2="124.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3A4D6E"/>
      <stop offset="100%" stop-color="#0F1A33"/>
    </linearGradient>
    <linearGradient id="g-f-front" x1="209" y1="219" x2="408.5" y2="225.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3D4F70"/>
      <stop offset="100%" stop-color="#0F1A33"/>
    </linearGradient>
    <linearGradient id="g-f-side" x1="209" y1="224" x2="306" y2="415.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2A3D5C"/>
      <stop offset="100%" stop-color="#060D1F"/>
    </linearGradient>
  </defs>

  <!-- Base fills -->
  <rect width="400" height="400" fill="url(#bg-cool)"/>
  <rect width="400" height="400" fill="url(#bg-warm)"/>

  <!-- Isometric pattern across the full frame (Twitter crops to circle anyway) -->
  <rect width="400" height="400" fill="url(#iso)"/>

  <!-- Logo: source 413x472. Target height ~ 280px -> scale 0.5932 -> w=245. center: (77.5, 60) -->
  <g transform="translate(77.5 60) scale(0.5932)">
    <g stroke="#6F8099" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M205 0 L205 102 L87.5 175.5 L0 123 Z"           fill="url(#g-top)"/>
      <path d="M0 123 L87.5 175.5 L87.5 294.3 L0 346.8 Z"      fill="url(#g-left)"/>
      <path d="M0 346.8 L87.5 294.3 L304.5 420 L207.5 471.5 Z" fill="url(#g-front)"/>
    </g>
    <path d="M16.5 134.215 L195 26.5 L195 90 L71.5 167.5 Z"           fill="url(#g-h-top)"/>
    <path d="M16.5 134.215 L71.5 167.5 L71.5 300.503 L16.5 334.003 Z" fill="url(#g-h-left)"/>
    <path d="M16.5 334.003 L71.5 300.503 L209 383 L209 454 Z"         fill="url(#g-h-front)"/>
    <path d="M71.5 167.5 L71.5 300.503" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="0.6" fill="none"/>
    <path d="M0 123 L205 0" stroke="#E2E7EF" stroke-opacity="0.7" stroke-width="0.85" fill="none"/>
    <g stroke="#7E8FA8" stroke-opacity="0.65" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M209 98.5 L209 4.3335 L412.5 124.5 L412.5 222.338 Z" fill="url(#g-f-top)"/>
      <path d="M209 219 L309.5 165 L408.5 225.5 L308 279.5 Z"       fill="url(#g-f-front)"/>
      <path d="M209 357 L209 224 L306 283.5 L306 415.5 Z"           fill="url(#g-f-side)"/>
    </g>
    <path d="M209 4.3335 L412.5 124.5" stroke="#6E809A" stroke-opacity="0.8" stroke-width="0.75" fill="none"/>
  </g>
</svg>
